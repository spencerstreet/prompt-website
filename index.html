<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt — The social social media app</title>
<meta name="description" content="Prompt is the social social media app. No feed, no followers, no noise — just invitations from people you actually know." />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://prompt.spencer.st/" />
<meta property="og:title" content="Prompt — The social social media app" />
<meta property="og:description" content="No feed, no followers, no noise — just invitations from people you actually know." />
<meta property="og:image" content="https://prompt.spencer.st/assets/hero.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#1D0A1D" />

<link rel="icon" href="assets/app-icon.png" />
<link rel="apple-touch-icon" href="assets/app-icon.png" />
<link rel="preload" as="image" href="assets/hero.jpg" />
<link rel="stylesheet" href="styles/colors_and_type.css" />
<link rel="stylesheet" href="styles/site.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
</head>
<body>

<!-- ───────────────────────── HERO ───────────────────────── -->
<main class="hero">
  <img class="hero-bg" src="assets/hero.jpg" alt="" aria-hidden="true" />
  <div class="hero-scrim" aria-hidden="true"></div>

  <div class="hero-inner">
    <a class="brand" href="/" aria-label="Prompt">
      <img src="assets/app-icon.png" alt="" />
      <span>Prompt</span>
    </a>

    <div class="hero-copy">
      <h1>The&nbsp;social<br /><em>social media</em><br />app.</h1>
      <p class="hero-sub">No feed. No followers. No noise. Just invitations from people you actually know.</p>

      <div class="cta-row">
        <!-- TODO: replace with the live App Store link once the app is approved -->
        <a class="cta" href="APP_STORE_URL" data-appstore>
          <i class="ph-bold ph-apple-logo" aria-hidden="true"></i>
          <span>Download on the App&nbsp;Store</span>
        </a>
        <span class="cta-meta">iPhone · iOS 17+</span>
      </div>
    </div>

    <footer class="hero-foot">
      <span>© <span data-year>2026</span> Prompt</span>
      <a href="https://spencer.st">spencer.st</a>
      <a href="mailto:hello@spencer.st">Contact</a>
    </footer>
  </div>
</main>

<!-- ───────────────────────── SCREENS ───────────────────────── -->
<section class="screens" aria-label="Inside the app">
  <div class="wrap">
    <h2 class="screens-h">A quiet list of <em>invitations.</em></h2>
    <div class="screens-row">
      <figure class="phone">
        <img loading="lazy" decoding="async" src="assets/screens/home.png" alt="The Prompt home screen: a bouldering session and a canal run, each showing the host, time, place and who's going" />
      </figure>
      <figure class="phone">
        <img loading="lazy" decoding="async" src="assets/screens/event_poll.png" alt="A Prompt event, Birthday drinks, showing who is going and a poll for which night works best" />
      </figure>
      <figure class="phone">
        <img loading="lazy" decoding="async" src="assets/screens/comments.png" alt="An event's comments in Prompt, with friends saying what they will bring and when they will arrive" />
      </figure>
    </div>
  </div>
</section>

<script>
  document.querySelector('[data-year]').textContent = new Date().getFullYear();

  // The screens section only earns its place once real screenshots are in
  // assets/screens/. Until then, hide it rather than ship empty frames.
  (function () {
    var section = document.querySelector('.screens');
    var imgs = Array.prototype.slice.call(section.querySelectorAll('.phone img'));
    var pending = imgs.length;
    var loaded = 0;

    function settle(img, ok) {
      if (ok) { loaded++; } else { img.closest('.phone').classList.add('is-empty'); }
      if (--pending === 0 && loaded === 0) { section.hidden = true; }
    }

    imgs.forEach(function (img) {
      // The error may already have fired before this script ran.
      if (img.complete) {
        settle(img, img.naturalWidth > 0);
      } else {
        img.addEventListener('load', function () { settle(img, true); });
        img.addEventListener('error', function () { settle(img, false); });
      }
    });
  })();
</script>
</body>
</html>
