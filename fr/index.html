    </a>

    <div class="hero-copy">
      <h1>Le réseau social<br />vraiment <em>social</em>.</h1>
      <p class="hero-sub">Pas de fil d’actualité. Pas d’abonnés. Pas de bruit. Juste des invitations de gens que vous connaissez vraiment.</p>

<!-- ───────────────────────── SCREENS ───────────────────────── -->
<section class="screens" aria-label="Dans l’application">
  <div class="wrap">
    <h2 class="screens-h">Une liste tranquille d’<em>invitations</em>.</h2>
    <div class="screens-row">
      <figure class="phone">
        <img loading="lazy" decoding="async" src="../assets/screens/home.png" alt="L’écran d’accueil de Prompt : une séance d’escalade de bloc et un footing le long du canal, chacun indiquant l’organisateur, l’heure, le lieu et les participants" />
      </figure>
      <figure class="phone">
        <img loading="lazy" decoding="async" src="../assets/screens/event_poll.png" alt="Un événement Prompt, Birthday drinks, montrant les participants et un sondage pour choisir la meilleure soirée" />
      </figure>
      <figure class="phone">
        <img loading="lazy" decoding="async" src="../assets/screens/comments.png" alt="Les commentaires d’un événement dans Prompt, où des amis disent ce qu’ils apportent et à quelle heure ils arrivent" />
      </figure>
    </div>
  </div>
</section>

<script>
  document.querySelector('[data-year]').textContent = new Date().getFullYear();

  (function () {
    var section = document.querySelector('.screens');
    var imgs = Array.prototype.slice.call(section.querySelectorAll('.phone img'));
    var pending = imgs.length;
    var loaded = 0;

    function settle(img, ok) {
      if (ok) { loaded++; } else { img.closest('.phone').classList.add('is-empty'); }
      if (--pending === 0 && loaded === 0) { section.hidden = true; }
    }

    imgs.forEach(function (img) {
      if (img.complete) {
        settle(img, img.naturalWidth > 0);
      } else {
        img.addEventListener('load', function () { settle(img, true); });
        img.addEventListener('error', function () { settle(img, false); });
      }
    });
  })();
</script>
</body>
